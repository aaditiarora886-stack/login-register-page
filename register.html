<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create Account</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --card: #1a1a26;
    --border: #2a2a40;
    --border-active: #6c63ff;
    --accent: #6c63ff;
    --accent2: #ff6b9d;
    --text: #f0f0ff;
    --muted: #8888aa;
    --success: #4ade80;
    --error: #ff6b6b;
    --warn: #fbbf24;
    --mono: 'DM Mono', monospace;
    --head: 'Syne', sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 20% 10%, rgba(108,99,255,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 50% 30% at 80% 90%, rgba(255,107,157,0.08) 0%, transparent 60%);
    pointer-events: none;
  }

  .grid-bg {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(108,99,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(108,99,255,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .container {
    width: 100%;
    max-width: 480px;
    position: relative;
    z-index: 1;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid rgba(108,99,255,0.3);
    padding: 5px 12px;
    border-radius: 100px;
    margin-bottom: 1.2rem;
  }

  .badge::before { content: '◆'; font-size: 7px; }

  h1 {
    font-family: var(--head);
    font-size: 2.2rem;
    font-weight: 700;
    line-height: 1.1;
    margin-bottom: 0.4rem;
    letter-spacing: -0.5px;
  }

  h1 span { color: var(--accent); }

  .subtitle {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 2rem;
    line-height: 1.6;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2rem;
  }

  .field {
    margin-bottom: 1.2rem;
  }

  label {
    display: block;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .input-wrap {
    position: relative;
  }

  input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px 14px;
    padding-right: 40px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  input:focus {
    border-color: var(--border-active);
    box-shadow: 0 0 0 3px rgba(108,99,255,0.15);
  }

  input.valid { border-color: var(--success); }
  input.invalid { border-color: var(--error); }

  .toggle-pw {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 16px;
    padding: 2px;
    line-height: 1;
    transition: color 0.2s;
  }
  .toggle-pw:hover { color: var(--text); }

  .field-note {
    font-size: 11px;
    color: var(--muted);
    margin-top: 5px;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .field-note.ok { color: var(--success); }
  .field-note.err { color: var(--error); }

  .strength-bar {
    height: 3px;
    background: var(--border);
    border-radius: 10px;
    margin-top: 8px;
    overflow: hidden;
  }

  .strength-fill {
    height: 100%;
    border-radius: 10px;
    transition: width 0.4s ease, background 0.4s;
    width: 0%;
  }

  .pw-rules {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    margin-top: 8px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }

  .rule {
    font-size: 11px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
    transition: color 0.2s;
  }

  .rule.met { color: var(--success); }

  .rule-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--border);
    flex-shrink: 0;
    transition: background 0.2s;
  }

  .rule.met .rule-dot { background: var(--success); }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 1.5rem 0;
  }

  .hash-preview {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 11px;
    color: var(--muted);
    word-break: break-all;
    line-height: 1.7;
    display: none;
  }

  .hash-preview.visible { display: block; }
  .hash-preview .label { color: var(--accent); margin-bottom: 4px; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; }
  .hash-preview .hash-val { color: #7c7cff; font-size: 10.5px; }

  button[type="submit"] {
    width: 100%;
    padding: 13px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-family: var(--head);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.5px;
    cursor: pointer;
    margin-top: 1rem;
    transition: opacity 0.2s, transform 0.1s;
  }

  button[type="submit"]:hover { opacity: 0.9; transform: translateY(-1px); }
  button[type="submit"]:active { transform: translateY(0); }
  button[type="submit"]:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .login-link {
    text-align: center;
    margin-top: 1.2rem;
    font-size: 12px;
    color: var(--muted);
  }

  .login-link a { color: var(--accent); text-decoration: none; }
  .login-link a:hover { text-decoration: underline; }

  .toast {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--card);
    border: 1px solid var(--success);
    color: var(--success);
    padding: 12px 24px;
    border-radius: 100px;
    font-size: 13px;
    transition: transform 0.4s ease;
    z-index: 100;
    white-space: nowrap;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.error-toast { border-color: var(--error); color: var(--error); }

  .step-row {
    display: flex;
    gap: 8px;
    margin-bottom: 1.5rem;
  }

  .step {
    flex: 1;
    height: 3px;
    background: var(--border);
    border-radius: 10px;
    transition: background 0.3s;
  }

  .step.active { background: var(--accent); }
  .step.done { background: var(--success); }
</style>
</head>
<body>
<div class="grid-bg"></div>

<div class="container">
  <div class="badge">Step 1 of 2 — Register</div>
  <h1>Create your<br><span>account</span></h1>
  <p class="subtitle">Fill in your details below. Your password is hashed<br>with SHA-256 before being stored — never plain text.</p>

  <div class="step-row">
    <div class="step active" id="s1"></div>
    <div class="step" id="s2"></div>
  </div>

  <div class="card">
    <form id="regForm" autocomplete="off">

      <div class="field">
        <label for="fullname">Full Name</label>
        <div class="input-wrap">
          <input type="text" id="fullname" placeholder="e.g. Ananya Sharma" />
        </div>
        <p class="field-note" id="nameNote"></p>
      </div>

      <div class="field">
        <label for="username">Username</label>
        <div class="input-wrap">
          <input type="text" id="username" placeholder="e.g. ananya_s" />
        </div>
        <p class="field-note" id="userNote"></p>
      </div>

      <div class="field">
        <label for="email">Email Address</label>
        <div class="input-wrap">
          <input type="email" id="email" placeholder="you@example.com" />
        </div>
        <p class="field-note" id="emailNote"></p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="Min 16 characters" />
          <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password">👁</button>
        </div>
        <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
        <div class="pw-rules" id="pwRules">
          <div class="rule" id="r-len"><span class="rule-dot"></span>16+ chars</div>
          <div class="rule" id="r-upper"><span class="rule-dot"></span>Uppercase letter</div>
          <div class="rule" id="r-num"><span class="rule-dot"></span>A number</div>
          <div class="rule" id="r-special"><span class="rule-dot"></span>Special char</div>
        </div>
        <div class="hash-preview" id="hashBox">
          <div class="label">🔒 SHA-256 hash preview (what gets stored)</div>
          <div class="hash-val" id="hashVal"></div>
        </div>
      </div>

      <div class="field">
        <label for="confirm">Confirm Password</label>
        <div class="input-wrap">
          <input type="password" id="confirm" placeholder="Re-enter password" />
          <button type="button" class="toggle-pw" id="toggleCf" aria-label="Show confirm password">👁</button>
        </div>
        <p class="field-note" id="confirmNote"></p>
      </div>

      <div class="divider"></div>

      <button type="submit" id="submitBtn" disabled>Create Account →</button>
    </form>
  </div>

  <p class="login-link">Already have an account? <a href="login.html">Sign in</a></p>
</div>

<div class="toast" id="toast"></div>

<script>
  const $ = id => document.getElementById(id);

  // SHA-256 implementation (pure JS, no library needed)
  async function sha256(message) {
    const msgBuffer = new TextEncoder().encode(message);
    const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  }

  // Password rules
  const rules = {
    len: pw => pw.length >= 16,
    upper: pw => /[A-Z]/.test(pw),
    num: pw => /[0-9]/.test(pw),
    special: pw => /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(pw)
  };

  function getStrength(pw) {
    let score = 0;
    if (rules.len(pw)) score++;
    if (rules.upper(pw)) score++;
    if (rules.num(pw)) score++;
    if (rules.special(pw)) score++;
    return score;
  }

  let pwDebounce;

  $('password').addEventListener('input', async function () {
    const pw = this.value;

    // Rule indicators
    ['len','upper','num','special'].forEach(k => {
      const el = $('r-' + k);
      if (rules[k](pw)) el.classList.add('met');
      else el.classList.remove('met');
    });

    // Strength bar
    const score = getStrength(pw);
    const fill = $('strengthFill');
    fill.style.width = (score / 4 * 100) + '%';
    const colors = ['#ff6b6b','#fbbf24','#fbbf24','#4ade80','#4ade80'];
    fill.style.background = colors[score];

    // SHA-256 hash preview (debounced)
    clearTimeout(pwDebounce);
    if (pw.length > 0) {
      pwDebounce = setTimeout(async () => {
        const hash = await sha256(pw);
        $('hashVal').textContent = hash;
        $('hashBox').classList.add('visible');
      }, 600);
    } else {
      $('hashBox').classList.remove('visible');
    }

    validateAll();
  });

  $('togglePw').addEventListener('click', () => {
    const inp = $('password');
    inp.type = inp.type === 'password' ? 'text' : 'password';
    $('togglePw').textContent = inp.type === 'password' ? '👁' : '🙈';
  });

  $('toggleCf').addEventListener('click', () => {
    const inp = $('confirm');
    inp.type = inp.type === 'password' ? 'text' : 'password';
    $('toggleCf').textContent = inp.type === 'password' ? '👁' : '🙈';
  });

  $('confirm').addEventListener('input', function () {
    const pw = $('password').value;
    const cf = this.value;
    const note = $('confirmNote');
    if (cf.length === 0) { note.textContent = ''; this.className = ''; }
    else if (pw === cf) {
      note.textContent = '✓ Passwords match';
      note.className = 'field-note ok';
      this.className = 'valid';
    } else {
      note.textContent = '✗ Passwords do not match';
      note.className = 'field-note err';
      this.className = 'invalid';
    }
    validateAll();
  });

  $('email').addEventListener('input', function () {
    const val = this.value;
    const note = $('emailNote');
    if (!val) { note.textContent = ''; this.className = ''; return; }
    const ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val);

    // Check duplicate email
    const users = JSON.parse(localStorage.getItem('registeredUsers') || '[]');
    const dup = users.find(u => u.email === val);

    if (dup) {
      note.textContent = '✗ This email is already registered';
      note.className = 'field-note err';
      this.className = 'invalid';
    } else if (!ok) {
      note.textContent = '✗ Enter a valid email address';
      note.className = 'field-note err';
      this.className = 'invalid';
    } else {
      note.textContent = '✓ Email looks good';
      note.className = 'field-note ok';
      this.className = 'valid';
    }
    validateAll();
  });

  $('username').addEventListener('input', function () {
    const val = this.value.trim();
    const note = $('userNote');
    if (!val) { note.textContent = ''; this.className = ''; return; }
    const ok = /^[a-z0-9_]{3,20}$/.test(val);
    if (!ok) {
      note.textContent = '✗ 3–20 chars, lowercase letters/numbers/underscore only';
      note.className = 'field-note err';
      this.className = 'invalid';
    } else {
      note.textContent = '✓ Username available';
      note.className = 'field-note ok';
      this.className = 'valid';
    }
    validateAll();
  });

  $('fullname').addEventListener('input', function () {
    const val = this.value.trim();
    const note = $('nameNote');
    if (!val) { note.textContent = ''; this.className = ''; return; }
    if (val.length < 2) {
      note.textContent = '✗ Name too short';
      note.className = 'field-note err';
      this.className = 'invalid';
    } else {
      note.textContent = '✓ Looks good';
      note.className = 'field-note ok';
      this.className = 'valid';
    }
    validateAll();
  });

  function validateAll() {
    const pw = $('password').value;
    const allRules = Object.values(rules).every(fn => fn(pw));
    const match = $('password').value === $('confirm').value && $('confirm').value.length > 0;
    const emailOk = $('email').className === 'valid';
    const userOk = $('username').className === 'valid';
    const nameOk = $('fullname').className === 'valid';

    $('submitBtn').disabled = !(allRules && match && emailOk && userOk && nameOk);

    // Update step indicator
    const step2 = (allRules && match) ? 'active' : '';
    $('s1').className = 'step done';
    $('s2').className = 'step ' + step2;
  }

  function showToast(msg, isError) {
    const t = $('toast');
    t.textContent = msg;
    t.className = 'toast' + (isError ? ' error-toast' : '') + ' show';
    setTimeout(() => t.className = 'toast' + (isError ? ' error-toast' : ''), 3000);
  }

  $('regForm').addEventListener('submit', async function (e) {
    e.preventDefault();

    const name = $('fullname').value.trim();
    const username = $('username').value.trim();
    const email = $('email').value.trim();
    const pw = $('password').value;

    const hashedPassword = await sha256(pw);

    // Save to localStorage (simulating a database)
    const users = JSON.parse(localStorage.getItem('registeredUsers') || '[]');

    // Check duplicate email again at submit
    if (users.find(u => u.email === email)) {
      showToast('That email is already registered!', true);
      return;
    }

    const newUser = {
      id: Date.now(),
      name,
      username,
      email,
      passwordHash: hashedPassword,
      createdAt: new Date().toISOString()
    };

    users.push(newUser);
    localStorage.setItem('registeredUsers', JSON.stringify(users));

    showToast('✓ Account created! Redirecting to login…');
    setTimeout(() => window.location.href = 'login.html', 1800);
  });
</script>
</body>
</html>
